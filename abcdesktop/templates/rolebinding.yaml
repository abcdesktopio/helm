apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pyos-rbac
  namespace: {{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: pyos-serviceaccount
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: pyos-role
  apiGroup: rbac.authorization.k8s.io