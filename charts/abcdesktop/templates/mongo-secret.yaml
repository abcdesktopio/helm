---
# WARNING: this file relies on `lookup`, which requires a live connection to the
# Kubernetes API at template-render time.
# - `helm template` and `helm install/upgrade --dry-run` (client-side) CANNOT
#   query the cluster: $existing will always be empty, and a brand-new random
#   password will be generated on every render.
# - To validate this chart in CI without risking a password mismatch, use
#   `helm upgrade --install --dry-run=server` (server-side dry-run, which
#   actually performs the lookup) instead of a plain `helm template`.
# - Never manually delete the `secret-mongodb` Secret without also wiping the
#   associated persistent MongoDB data — see the `helm.sh/resource-policy: keep`
#   annotation below.
{{- $mongo_root_password := "" }}
{{- $mongo_password := "" }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "secret-mongodb") }}
{{- if $existing }}
  {{- $mongo_root_password = (index $existing.data "MONGO_ROOT_PASSWORD" | b64dec) }}
  {{- $mongo_password = (index $existing.data "MONGO_PASSWORD" | b64dec) }}
{{- else }}
  {{- $mongo_root_password = (include "abcdesktop.mongorootpassword" .) }}
  {{- $mongo_password = (include "abcdesktop.mongopassword" .) }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  namespace: {{ .Release.Namespace }}
  name: secret-mongodb
  labels:
    abcdesktop/role: mongodb
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  MONGO_ROOT_USERNAME: 'root'
  MONGO_ROOT_PASSWORD: {{ $mongo_root_password }}
  MONGO_USERNAME: 'pyos'
  MONGO_PASSWORD: {{ $mongo_password }}
  MONGO_USERS_LIST: 'pyos:readWrite:{{ $mongo_password }}'
  MONGO_DBS_LIST: 'image,fail2ban,loginHistory,applications,profiles,desktop'
  MONGODB_URL: 'mongodb://pyos:{{ $mongo_password }}@mongodb'
