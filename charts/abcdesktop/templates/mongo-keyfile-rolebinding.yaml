# mongo-keyfile-rolebinding.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mongo-keyfile-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    abcdesktop/role: mongodb
  annotations:
    "helm.sh/hook": pre-install,post-upgrade
    "helm.sh/hook-weight": "-30"    
subjects:
  - kind: ServiceAccount
    name: mongo-keyfile-serviceaccount
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: mongo-keyfile-role
  apiGroup: rbac.authorization.k8s.io