# mongo-keyfile-role.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mongo-keyfile-role
  namespace: {{ .Release.Namespace }}
  labels:
    abcdesktop/role: mongodb
  annotations:
    "helm.sh/hook": pre-install,post-upgrade
    "helm.sh/hook-weight": "-40"    
rules:
  # Nécessaire pour créer le secret (create ne supporte pas resourceNames)
  - apiGroups: ['']
    resources: ['secrets']
    verbs: ['create']
  # Restreint au seul secret ciblé pour la lecture (idempotence du script)
  - apiGroups: ['']
    resources: ['secrets']
    verbs: ['get']
    resourceNames: ['abcdesktop-mongod-keyfile']