# Default values for mongo subchart
enabled: true

keysgenerator:
  image: ghcr.io/abcdesktopio/keysgenerator
  tag: 4.2
  mongodkeylength: 756
  
data:
  initContainerScriptPath: "data/init-container.sh"
  configFilePath: "data/etc/mongodb/mongod.conf"
  initScriptPath: "data/docker-entrypoint-initdb.d/init.js"
  initReplicaScriptPath: "data/docker-entrypoint-initdb.d/init-replica.sh"

image:
  # repository: mongo
  # tag: "8.0"
  # repository: mongo-safe
  # tag: "8.0"
  repository: ghcr.io/abcdesktopio/mongo
  tag: "safe8.0"
  pullPolicy: IfNotPresent

replicaCount: 1

# service:
#   type: ClusterIP
#   port: 27017
#   name: mongodb

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# # MongoDB authentication
# auth:
#   enabled: true
#   database: "desktop"
#   username: "root"
#   # Le mot de passe sera généré ou fourni via existingSecret
#   existingSecret: ""

# Persistence - Configuration du stockage des données MongoDB
persistence:
  # enabled: true pour volume persistant, false pour volume non-persistant (emptyDir)
  enabled: false
  # Classe de stockage à utiliser (laisser vide pour utiliser la classe par défaut)
  storageClass: ""
  # Taille du volume persistant
  size: 8Gi
  # Point de montage dans le conteneur (ne pas modifier)
  mountPath: /data/db

# # Node selector
# nodeSelector: {}

# # Tolerations
# tolerations: []

# # Affinity
# affinity: {}

# # Pod annotations
# podAnnotations: {}

# # Security context
# securityContext: {}
