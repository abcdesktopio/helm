apiVersion: batch/v1
kind: Job
metadata:
  namespace: {{ .Release.Namespace }}
  name: generate-jwtusersigning-keys
spec:
  template:
    spec:
      serviceAccountName: pyos-serviceaccount
      restartPolicy: OnFailure
      ttlSecondsAfterFinished: 10
      containers:
      - name: generate-keys
        imagePullPolicy: IfNotPresent
        image: {{ .Values.keysgenerator.image }}:{{ .Values.keysgenerator.tag }}
        command: ["/bin/sh", "-c"]
        args:
          - |
            openssl genrsa -out abcdesktop_jwt_user_signing_private_key.pem {{ .Values.keysgenerator.jwtusersigningkeylength }}  && \
            openssl rsa -in abcdesktop_jwt_user_signing_private_key.pem -outform PEM -pubout -out abcdesktop_jwt_user_signing_public_key.pem && \
            kubectl create secret generic abcdesktopjwtusersigning --from-file=abcdesktop_jwt_user_signing_private_key.pem --from-file=abcdesktop_jwt_user_signing_public_key.pem --namespace={{ .Release.Namespace }} 
