apiVersion: v1
kind: Service
metadata:
  # name: {{ .Release.Name }}-service
  name: mongodb
  namespace: {{ .Release.Namespace }}
  labels:
    # app: mongodb
    abcdesktop/role: mongodb
spec:
  ports:
  - protocol: TCP
    port: 27017
    targetPort: 27017
    name: mongodb
  clusterIP: None
  # selector:
  #   app: mongodb
  selector:
    run: mongodb-od 
