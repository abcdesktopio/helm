apiVersion: v1
kind: ConfigMap
metadata:
  name: abcdesktop-group-templatefile
  namespace: {{ .Release.Namespace }}
data:
  group: |
    sudo:x:27:{{ "{{" }} uid {{ "}}" }}
    lpadmin:x:101:root,{{ "{{" }} uid {{ "}}" }}
    {{ "{{" }} gid {{ "}}" }}:x:{{ "{{" }} gidNumber {{ "}}" }}:{{ "{{" }} uid {{ "}}" }}