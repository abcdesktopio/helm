apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb-od
  namespace: {{ .Release.Namespace }}
  labels:
    run: mongodb-od
    type: database
    abcdesktop/role: mongodb
spec:
  serviceName: mongodb
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      run: mongodb-od
  template:
    metadata:
      labels:
        run: mongodb-od
        type: database
    spec:
      terminationGracePeriodSeconds: 10

      # --- InitContainer to prepare configuration
      initContainers:
        - name: prepare-config
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - /scripts/init-container.sh
          volumeMounts:
            - name: init-container-script
              mountPath: /scripts/init-container.sh
              subPath: init-container.sh
              readOnly: true          
            - name: config
              mountPath: /input/mongod.conf
              subPath: mongod.conf
            - name: keyfile
              mountPath: /input/mongod.keyfile
              subPath: mongod.keyfile
            - name: prepared-config
              mountPath: /work/config
            - name: logs
              mountPath: /var/log/mongodb

      # --- Main MongoDB container
      containers:
      - name: mongodb
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        # DO NOT use `command`, keep docker-entrypoint.sh
        args: ["--config=/etc/mongodb/mongod.conf"]
        ports:
        - containerPort: 27017
          name: mongodb
        volumeMounts:
          - name: prepared-config
            mountPath: /etc/mongodb
          - name: abcdesktop
            mountPath: /etc/abcdesktop
            readOnly: true
          - name: init-script
            mountPath: /docker-entrypoint-initdb.d/init.js
            subPath: init.js
            readOnly: true
          - name: logs
            mountPath: /var/log/mongodb
          - name: data
            mountPath: /data/db
        env:
          - name: MONGO_INITDB_ROOT_USERNAME_FILE
            value: /etc/abcdesktop/admin/MONGO_ROOT_USERNAME
          - name: MONGO_INITDB_ROOT_PASSWORD_FILE
            value: /etc/abcdesktop/admin/MONGO_ROOT_PASSWORD
        readinessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 6
        resources:
{{ toYaml .Values.resources | indent 10 }}

      # --- Non-persistent volumes
      volumes:
        - name: init-container-script
          configMap:
            name: configmap-mongodb-scripts
            items:
              - key: init-container.sh
                path: init-container.sh
            defaultMode: 0755
        - name: config
          configMap:
            name: configmap-mongodb-scripts
            items:
              - key: mongod.conf
                path: mongod.conf
        - name: abcdesktop
          secret:
            secretName: secret-mongodb
            items:
            - key: MONGO_ROOT_USERNAME
              path: admin/MONGO_ROOT_USERNAME
              mode: 0444
            - key: MONGO_ROOT_PASSWORD
              path: admin/MONGO_ROOT_PASSWORD
              mode: 0444
            - key: MONGO_USERNAME
              path: MONGO_USERNAME
              mode: 0444
            - key: MONGO_PASSWORD
              path: MONGO_PASSWORD
              mode: 0444
            - key: MONGO_USERS_LIST
              path: MONGO_USERS_LIST
              mode: 0444
            - key: MONGO_DBS_LIST
              path: MONGO_DBS_LIST
              mode: 0444
        - name: init-script
          configMap:
            name: configmap-mongodb-scripts
            items:
              - key: init.js
                path: init.js
        - name: keyfile
          secret:
            secretName: {{ .Release.Name }}-secret-keyfile
        - name: prepared-config
          emptyDir: {}
        - name: logs
          emptyDir: {}
        {{- if not .Values.persistence.enabled }}
        # --- Non-persistent volume for MongoDB data
        - name: data
          emptyDir: {}
        {{- end }}

{{- if .Values.persistence.enabled }}
  # --- Persistent volume for MongoDB data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
{{- end }}
