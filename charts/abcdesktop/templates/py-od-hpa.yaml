{{- if .Values.pyos.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pyos-os
  labels:
    abcdesktop/role: pyos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pyos-os
  minReplicas: {{ .Values.pyos.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.pyos.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.pyos.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.pyos.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.pyos.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.pyos.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
