---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret-keyfile
  namespace: {{ .Release.Namespace }}
  # labels:
  #   app: mongodb
type: Opaque
data:
  mongod.keyfile: {{ .Files.Get .Values.data.keyfilePath | b64enc | quote }}
  
